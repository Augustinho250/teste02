plugins {
    id 'com.android.application'
}

android {
    namespace 'com.masteria.app'
    compileSdk 35

    signingConfigs {
        debugStable {
            storeFile file('../masteria-dev.keystore')
            storePassword 'masteria-dev-2026'
            keyAlias 'masteria-dev'
            keyPassword 'masteria-dev-2026'
        }
    }

    defaultConfig {
        applicationId 'com.masteria.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugStable
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
